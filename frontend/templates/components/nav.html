{#
  nav.html — top navigation bar (global, sticky)

  Brand on the left, links on the right. Search bar gets added in Step 2
  when we wire up the Nifty 500 autocomplete.
#}
<nav class="nav" aria-label="Primary navigation">
  <div class="nav__inner">
    <a href="/" class="nav__brand" aria-label="Stock Price Predictor home">
      <span class="nav__brand-mark" aria-hidden="true">📈</span>
      <span>Stock Price Predictor</span>
    </a>

    {% include "components/search_bar.html" %}

    <div class="nav__links">
      <a href="/" class="nav__link"
         {% if request.url.path == "/" %}aria-current="page"{% endif %}>
        Predict
      </a>
      <a href="/history" class="nav__link"
         {% if request.url.path == "/history" %}aria-current="page"{% endif %}>
        History
      </a>
      <a href="/docs/how_it_works.html" class="nav__link"
         target="_blank" rel="noopener"
         aria-label="How it works (opens in a new tab)">
        How it works
        <span aria-hidden="true">↗</span>
      </a>
    </div>
  </div>
</nav>
